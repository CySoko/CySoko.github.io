<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>volume dial</title>
  <link rel="stylesheet" href="volume.css" />
</head>
<body>

  <div id="timer-wrapper">
    <span id="timer-label">Time it has taken you..</span>
    <span id="timer-display">0s</span>
  </div>

  <div id="arena">
    <div id="dial-up" class="dial"><span class="dial-label">+</span></div>
    <div id="dial-down" class="dial"><span class="dial-label">−</span></div>
  </div>

  <div id="controls">
    <span id="volume-display">50%</span>
    <button id="submit-btn">Submit</button>
  </div>

  <script src="volume.js"></script>
</body>
</html>
