<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Goldn Tasting</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
</style>
</head>
<body>
<!--
  Goldn v3 tasting survey (price sliders, then taste).
  Same Apps Script app and APP_URL as index.html; ?v=3 tells it to serve the v3 survey (V3.html).
  index.html (where the printed QR codes point) still serves the current survey.
  MODE: 'frame'    = show the app inside this page (works around the multiple-Google-accounts bug)
        'redirect' = send the visitor straight to APP_URL (use if framing ever breaks)
-->
<iframe id="app" title="Goldn Tasting" hidden></iframe>
<noscript>
  <p style="font:16px sans-serif;text-align:center;padding:40px 20px">
    <a href="https://script.google.com/macros/s/AKfycbyyPmYUi8l64iu-0lTxY5vr834Szjfko-j2dmU88Y4c0P3FWBIzUZO0dhEpXyE4kuEePw/exec?v=3">Open the Goldn review</a>
  </p>
</noscript>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyyPmYUi8l64iu-0lTxY5vr834Szjfko-j2dmU88Y4c0P3FWBIzUZO0dhEpXyE4kuEePw/exec';
  var MODE = 'frame';

  // Pass the event tag through, e.g. cysoko.github.io/goldn-review/v3.html?event=farmers-market
  var params = new URLSearchParams(location.search);
  var target = APP_URL + '?v=3';
  var ev = params.get('event');
  if (ev) target += '&event=' + encodeURIComponent(ev.slice(0, 60));

  if (MODE === 'redirect') {
    location.replace(target);
  } else {
    var f = document.getElementById('app');
    f.src = target;
    f.hidden = false;
  }
</script>
</body>
</html>
